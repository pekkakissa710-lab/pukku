<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirjaudu — Pukku Pankki</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#EEF2FA;--panel:#fff;--blue:#3E7BFA;--blue-soft:#2A5FE0;--blue-glow:rgba(62,123,250,.28);--line:rgba(16,24,40,.09);--text:#10182B;--muted:#7C879E}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,rgba(62,123,250,.08),transparent 60%),var(--ink);font-family:Inter,sans-serif;color:var(--text)}
    .card{width:100%;max-width:400px;background:var(--panel);border-radius:24px;padding:32px 28px;border:1px solid var(--line);box-shadow:0 20px 50px -20px rgba(16,24,40,.15)}
    .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:20px}
    .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 8px var(--blue-glow)}
    h1{font-family:'Space Grotesk',sans-serif;font-size:26px;margin:0 0 8px}
    .muted{color:var(--muted);font-size:14px;margin-bottom:24px}
    label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--muted)}
    input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:15px;background:#F6F8FC;margin-bottom:14px;font-family:inherit}
    input:focus{outline:none;border-color:var(--blue);background:#fff}
    .btn{width:100%;padding:14px;border:none;border-radius:14px;font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue-soft));cursor:pointer}
    .error{background:rgba(239,68,68,.1);color:#B91C1C;border:1px solid rgba(239,68,68,.25);padding:12px 16px;border-radius:12px;font-size:14px;margin-bottom:16px;display:none}
    a{color:var(--blue);text-decoration:none}
    .footer{text-align:center;margin-top:20px;font-size:14px}

    #sleepOverlay{
      position:fixed;inset:0;z-index:9999;background:#0f172a;
      display:none;flex-direction:column;align-items:center;justify-content:center;
      color:#fff;text-align:center;padding:32px;font-family:'Space Grotesk',sans-serif;
    }
    #sleepOverlay h1{font-size:28px;margin:0 0 12px;letter-spacing:.04em}
    #sleepOverlay p{color:#94a3b8;font-size:15px;margin:0 0 28px;max-width:320px;line-height:1.5}
    #sleepOverlay button{
      padding:14px 28px;border:none;border-radius:14px;
      background:linear-gradient(135deg,#3E7BFA,#2A5FE0);color:#fff;
      font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;cursor:pointer;
    }
  </style>
</head>
<body>
  <div id="sleepOverlay">
    <h1>SERVER IS SLEEPING</h1>
    <p>Render free-tier nukkuu. Paina nappia herättääksesi palvelimen (kestää 30–60 sekuntia).</p>
    <button id="refreshBtn">Refresh</button>
  </div>

  <div class="card">
    <div class="eyebrow"><span class="dot"></span>Pukku Pankki</div>
    <h1>Kirjaudu sisään</h1>
    <p class="muted">Demo: alice / alice123 · bob / bob123</p>
    <div class="error" id="error"></div>
    <form id="form">
      <label>Käyttäjänimi</label>
      <input type="text" id="username" required autocomplete="username" autofocus>
      <label>Salasana</label>
      <input type="password" id="password" required autocomplete="current-password">
      <button type="submit" class="btn">Kirjaudu</button>
    </form>
    <p class="footer">Ei tiliä? <a href="register.html">Rekisteröidy</a></p>
  </div>

  <script>
    const overlay = document.getElementById('sleepOverlay');

    async function fetchWithTimeout(url, options = {}, timeoutMs = 5000) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
      
      try {
        const response = await fetch(url, {
          ...options,
          signal: controller.signal,
          credentials: 'include'
        });
        clearTimeout(timeoutId);
        return response;
      } catch (err) {
        clearTimeout(timeoutId);
        throw err;
      }
    }

    async function checkServer() {
      try {
        await fetchWithTimeout('/api/health', {}, 5000);
        overlay.style.display = 'none';
      } catch (err) {
        if (err.name === 'AbortError' || err instanceof TypeError) {
          overlay.style.display = 'flex';
        }
      }
    }

    document.getElementById('refreshBtn').onclick = () => {
      overlay.querySelector('p').textContent = 'Herätetään serveriä… odota 30–60s';
      fetchWithTimeout('/api/health', {}, 6000).catch(() => {});
      setTimeout(() => location.reload(), 4000);
    };

    checkServer();

    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const error = document.getElementById('error');
      error.style.display = 'none';

      try {
        const res = await fetchWithTimeout('/api/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        }, 5000);

        overlay.style.display = 'none';

        const data = await res.json();
        if (data.success) {
          location.href = '/';
        } else {
          error.textContent = data.error || 'Virhe';
          error.style.display = 'block';
        }
      } catch (err) {
        if (err.name === 'AbortError' || err instanceof TypeError) {
          overlay.style.display = 'flex';
        }
      }
    };
  </script>
</body>
</html>
