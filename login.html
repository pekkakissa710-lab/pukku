<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kirjaudu — Pukku</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eef2fa;
  --card:#fff;
  --text:#10182b;
  --muted:#7c879e;
  --line:rgba(16,24,40,.09);
  --blue:#3e7bfa;
  --blue2:#2a5fe0;
  --red:#ef4444;
  --green:#10b981;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(
      900px 500px at 50% -100px,
      rgba(62,123,250,.14),
      transparent 65%
    ),
    var(--bg);
  font-family:Inter,sans-serif;
  color:var(--text);
}

.card{
  width:100%;
  max-width:430px;
  padding:34px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:28px;
  box-shadow:0 30px 80px -35px rgba(16,24,40,.25);
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
  color:var(--muted);
  font-size:11px;
  font-weight:600;
  letter-spacing:.15em;
  text-transform:uppercase;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--blue);
  box-shadow:0 0 14px rgba(62,123,250,.55);
}

h1{
  margin:24px 0 8px;
  font:700 30px "Space Grotesk",sans-serif;
  letter-spacing:-.03em;
}

.subtitle{
  margin:0 0 28px;
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
}

label{
  display:block;
  margin-bottom:7px;
  color:var(--muted);
  font-size:13px;
  font-weight:600;
}

input{
  width:100%;
  padding:14px 15px;
  margin-bottom:17px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#f6f8fc;
  color:var(--text);
  font:15px Inter,sans-serif;
  transition:.2s;
}

input:focus{
  outline:0;
  border-color:var(--blue);
  background:#fff;
  box-shadow:0 0 0 4px rgba(62,123,250,.1);
}

button{
  width:100%;
  border:0;
  border-radius:15px;
  padding:15px;
  color:white;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  font:600 16px "Space Grotesk",sans-serif;
  cursor:pointer;
  box-shadow:0 14px 30px -15px rgba(62,123,250,.7);
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.footer{
  margin:22px 0 0;
  text-align:center;
  color:var(--muted);
  font-size:14px;
}

a{
  color:var(--blue);
  text-decoration:none;
  font-weight:600;
}

.demo{
  margin-top:20px;
  padding:13px;
  border-radius:14px;
  background:#f6f8fc;
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
}

.demo strong{
  color:var(--text);
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  max-width:320px;
  padding:14px 18px;
  border-radius:14px;
  color:white;
  font-size:14px;
  z-index:20;
}

.toast.error{
  background:var(--red);
}

.toast.success{
  background:var(--green);
}

#sleepOverlay{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  padding:30px;
  background:#0f172a;
  color:#fff;
  text-align:center;
  z-index:999;
}

#sleepOverlay h2{
  font:700 30px "Space Grotesk",sans-serif;
  margin:0 0 10px;
}

#sleepOverlay p{
  max-width:340px;
  color:#94a3b8;
  line-height:1.5;
}

#refreshBtn{
  width:auto;
  padding:13px 24px;
}
</style>
</head>

<body>

<div id="sleepOverlay">

  <h2>
    SERVER IS SLEEPING
  </h2>

  <p>
    Render-palvelin nukkuu. Herätetään se.
  </p>

  <button id="refreshBtn">
    Yritä uudelleen
  </button>

</div>

<main class="card">

  <div class="brand">
    <span class="dot"></span>
    Pukku Pankki
  </div>

  <h1>
    Tervetuloa takaisin.
  </h1>

  <p class="subtitle">
    Kirjaudu Pukku-tilillesi jatkaaksesi.
  </p>

  <form id="form">

    <label for="username">
      Käyttäjänimi
    </label>

    <input
      id="username"
      type="text"
      autocomplete="username"
      maxlength="24"
      required
      autofocus
    >

    <label for="password">
      Salasana
    </label>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
      required
    >

    <button
      id="submitBtn"
      type="submit"
    >
      Kirjaudu sisään
    </button>

  </form>

  <div class="demo">
    <strong>Prototype demo</strong><br>
    alice / alice123<br>
    bob / bob123<br>
    carol / carol123
  </div>

  <p class="footer">
    Ei tiliä?
    <a href="/register.html">
      Luo tili
    </a>
  </p>

</main>

<script>
const overlay =
  document.getElementById("sleepOverlay");

const form =
  document.getElementById("form");

const submitButton =
  document.getElementById("submitBtn");

function showToast(
  message,
  type = "error"
) {
  const toast =
    document.createElement("div");

  toast.className =
    `toast ${type}`;

  toast.textContent =
    message;

  document.body.appendChild(
    toast
  );

  setTimeout(() => {
    toast.remove();
  }, 3500);
}

async function request(
  url,
  options = {},
  timeout = 15000
) {
  const controller =
    new AbortController();

  const timer =
    setTimeout(() => {
      controller.abort();
    }, timeout);

  try {

    const response =
      await fetch(url, {
        ...options,
        signal:
          controller.signal,
        credentials:
          "include",
        cache:
          "no-store"
      });

    clearTimeout(timer);

    return response;

  } catch (error) {

    clearTimeout(timer);

    throw error;
  }
}

async function checkServer() {
  try {

    const response =
      await request(
        "/api/health",
        {},
        15000
      );

    if (!response.ok) {
      throw new Error(
        "Health check failed"
      );
    }

    overlay.style.display =
      "none";

  } catch {

    /*
      Render voi olla juuri heräämässä.
      Älä näytä välittömästi verkkovirhettä.
    */

    overlay.style.display =
      "flex";
  }
}

document
  .getElementById("refreshBtn")
  .addEventListener(
    "click",
    () => {
      location.reload();
    }
  );

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    submitButton.disabled =
      true;

    submitButton.textContent =
      "Kirjaudutaan…";

    const username =
      document
        .getElementById("username")
        .value
        .trim()
        .toLowerCase();

    const password =
      document
        .getElementById("password")
        .value;

    try {

      const response =
        await request(
          "/api/login",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({
              username,
              password
            })
          },
          20000
        );

      let data = {};

      try {
        data =
          await response.json();
      } catch {
        data = {};
      }

      if (!response.ok) {

        showToast(
          data.error ||
          "Kirjautuminen epäonnistui.",
          "error"
        );

        submitButton.disabled =
          false;

        submitButton.textContent =
          "Kirjaudu sisään";

        return;
      }

      if (!data.success) {

        showToast(
          data.error ||
          "Kirjautuminen epäonnistui.",
          "error"
        );

        submitButton.disabled =
          false;

        submitButton.textContent =
          "Kirjaudu sisään";

        return;
      }

      showToast(
        "Kirjauduttu!",
        "success"
      );

      /*
        Odotetaan vähän, jotta session-cookie
        ehtii varmasti tallentua selaimeen.
      */

      setTimeout(() => {
        window.location.replace("/");
      }, 500);

    } catch (error) {

      if (
        error.name ===
        "AbortError"
      ) {

        showToast(
          "Palvelin ei vastannut. Yritä uudelleen.",
          "error"
        );

      } else {

        showToast(
          "Palvelimeen ei saatu yhteyttä. Tarkista internet-yhteys tai yritä uudelleen.",
          "error"
        );
      }

      submitButton.disabled =
        false;

      submitButton.textContent =
        "Kirjaudu sisään";
    }
  }
);

checkServer();
</script>

</body>
</html>
