<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pukku Pankki</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#EEF2FA;--panel:#fff;--blue:#3E7BFA;--blue-soft:#2A5FE0;--blue-glow:rgba(62,123,250,.28);--line:rgba(16,24,40,.09);--text:#10182B;--muted:#7C879E;--success:#10B981;--error:#EF4444}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(1200px 600px at 50% -10%,rgba(62,123,250,.08),transparent 60%),var(--ink);font-family:Inter,sans-serif;color:var(--text);padding:24px}
    .container{max-width:480px;margin:0 auto}
    .card{background:var(--panel);border-radius:24px;padding:28px 24px;border:1px solid var(--line);box-shadow:0 20px 50px -20px rgba(16,24,40,.15);margin-bottom:20px}
    .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
    .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 8px var(--blue-glow)}
    .nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    .nav a{font-size:13px;color:var(--muted);text-decoration:none;cursor:pointer}
    .balance-big{font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:700;margin:8px 0 4px}
    .muted{color:var(--muted);font-size:14px}
    h2{font-family:'Space Grotesk',sans-serif;font-size:20px;margin:0 0 16px}
    .btn{display:block;width:100%;padding:14px;border:none;border-radius:14px;font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue-soft));cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 10px 25px -8px var(--blue-glow)}
    .tx{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
    .tx:last-child{border-bottom:none}
    .out{color:var(--error)}.in{color:var(--success)}
    .id-badge{font-size:12px;background:rgba(62,123,250,.1);color:var(--blue);padding:4px 10px;border-radius:999px;display:inline-block;margin-top:6px}

    #sleepOverlay{
      position:fixed;inset:0;z-index:9999;
      background:#0f172a;
      display:none;flex-direction:column;align-items:center;justify-content:center;
      color:#fff;text-align:center;padding:32px;
      font-family:'Space Grotesk',sans-serif;
    }
    #sleepOverlay h1{font-size:28px;margin:0 0 12px;letter-spacing:.04em}
    #sleepOverlay p{color:#94a3b8;font-size:15px;margin:0 0 28px;max-width:320px;line-height:1.5}
    #sleepOverlay button{
      padding:14px 28px;border:none;border-radius:14px;
      background:linear-gradient(135deg,#3E7BFA,#2A5FE0);
      color:#fff;font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;
      cursor:pointer;
    }
  </style>
</head>
<body>
  <div id="sleepOverlay">
    <h1>SERVER IS SLEEPING</h1>
    <p>Render free-tier nukkuu. Paina nappia herättääksesi palvelimen (kestää 30–60 sekuntia).</p>
    <button id="refreshBtn">Refresh</button>
  </div>

  <div class="container">
    <div class="nav">
      <div class="eyebrow"><span class="dot"></span>Pukku Pankki</div>
      <a id="logout">Kirjaudu ulos</a>
    </div>

    <div class="card">
      <p class="muted" style="margin:0">Hei, <strong id="username">...</strong></p>
      <div class="balance-big" id="balance">—</div>
      <p class="muted" style="margin:0">Käytettävissä oleva saldo</p>
      <div class="id-badge">Oma ID: <span id="myId">—</span></div>
    </div>

    <div class="card">
      <a href="pay.html" class="btn">Siirrä pukkuja</a>
    </div>

    <div class="card">
      <h2>Tapahtumat</h2>
      <div id="txs"><p class="muted">Ladataan...</p></div>
    </div>
  </div>

  <script>
    const overlay = document.getElementById('sleepOverlay');

    document.getElementById('refreshBtn').onclick = () => {
      overlay.querySelector('p').textContent = 'Herätetään serveriä… odota 30–60s';
      fetch('/api/health').catch(()=>{});
      setTimeout(() => location.reload(), 5000);
    };

    async function load() {
      try {
        const res = await fetch('/api/me', {credentials:'include'});
        if (res.status === 401) return location.href = 'login.html';
        if (!res.ok) throw new Error();
        const data = await res.json();
        document.getElementById('username').textContent = data.username;
        document.getElementById('balance').textContent = data.balanceStr;
        document.getElementById('myId').textContent = data.id;

        const txRes = await fetch('/api/transactions', {credentials:'include'});
        const txs = await txRes.json();
        const box = document.getElementById('txs');
        if (!txs.length) {
          box.innerHTML = '<p class="muted">Ei vielä tapahtumia.</p>';
          return;
        }
        box.innerHTML = txs.map(tx => `
          <div class="tx">
            <div>
              ${tx.isOut ? '→ ' + tx.to_name + ' (ID ' + tx.to_user + ')' : '← ' + (tx.from_name || '?') + ' (ID ' + tx.from_user + ')'}
              ${tx.note ? '<br><span class="muted" style="font-size:12px">'+tx.note+'</span>' : ''}
              <br><span class="muted" style="font-size:12px">${tx.created_at.slice(0,16).replace('T',' ')}</span>
            </div>
            <div class="\( {tx.isOut ? 'out' : 'in'}"> \){tx.isOut ? '-' : '+'}${tx.amountStr}</div>
          </div>
        `).join('');
      } catch {
        overlay.style.display = 'flex';
      }
    }

    document.getElementById('logout').onclick = async () => {
      await fetch('/api/logout', {method:'POST', credentials:'include'});
      location.href = 'login.html';
    };

    load();
  </script>
</body>
</html>
