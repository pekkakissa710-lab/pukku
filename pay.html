<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siirrä — Pukku</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eef2fa;
  --card:#fff;
  --text:#10182b;
  --muted:#7c879e;
  --line:rgba(16,24,40,.09);
  --blue:#3e7bfa;
  --blue2:#2a5fe0;
  --red:#ef4444;
  --green:#10b981;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:
    radial-gradient(900px 500px at 50% -100px,rgba(62,123,250,.14),transparent 65%),
    var(--bg);
  color:var(--text);
  font-family:Inter,sans-serif;
}

.device{
  width:100%;
  max-width:410px;
  min-height:680px;
  padding:28px;
  border-radius:32px;
  border:1px solid var(--line);
  background:#fff;
  box-shadow:0 30px 80px -35px rgba(16,24,40,.25);
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden;
}

.device::after{
  content:"";
  position:absolute;
  width:300px;
  height:300px;
  border-radius:50%;
  background:rgba(62,123,250,.05);
  right:-170px;
  top:-130px;
  pointer-events:none;
}

.header{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
  color:var(--muted);
  font-size:11px;
  font-weight:600;
  letter-spacing:.15em;
  text-transform:uppercase;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--blue);
  box-shadow:0 0 14px rgba(62,123,250,.5);
}

.back{
  margin-left:auto;
  color:var(--muted);
  text-decoration:none;
  font-size:13px;
}

#payView{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  flex:1;
}

.receiver{
  margin-top:28px;
}

.receiver label{
  display:block;
  margin-bottom:8px;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
}

.receiver input{
  width:100%;
  padding:14px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#f6f8fc;
  text-align:center;
  font:600 16px "Space Grotesk",sans-serif;
  color:var(--text);
}

.receiver input:focus{
  outline:0;
  border-color:var(--blue);
  background:#fff;
}

.receiver-name{
  height:20px;
  margin-top:8px;
  text-align:center;
  color:var(--blue);
  font-size:13px;
}

.amount-wrap{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.amount-row{
  display:flex;
  align-items:baseline;
  gap:8px;
}

.amount{
  font:700 55px "Space Grotesk",sans-serif;
  letter-spacing:-.05em;
  font-variant-numeric:tabular-nums;
}

.amount.placeholder{
  color:rgba(16,24,40,.22);
}

.currency{
  color:var(--muted);
  font:600 20px "Space Grotesk",sans-serif;
}

.amount-label{
  margin-top:8px;
  color:var(--muted);
  font-size:12px;
}

.keypad{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.key{
  border:1px solid var(--line);
  border-radius:15px;
  padding:15px 0;
  background:#f6f8fc;
  color:var(--text);
  font:600 19px "Space Grotesk",sans-serif;
  cursor:pointer;
}

.key:active{
  transform:scale(.94);
  background:rgba(62,123,250,.1);
}

.key.func{
  color:var(--muted);
  font-size:13px;
}

.error{
  display:none;
  margin-top:12px;
  padding:11px 14px;
  border-radius:13px;
  background:rgba(239,68,68,.08);
  border:1px solid rgba(239,68,68,.2);
  color:#b91c1c;
  text-align:center;
  font-size:13px;
}

.pay{
  width:100%;
  margin-top:14px;
  padding:17px;
  border:0;
  border-radius:17px;
  color:white;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  font:600 17px "Space Grotesk",sans-serif;
  cursor:pointer;
  box-shadow:0 15px 30px -15px rgba(62,123,250,.7);
}

.pay:disabled{
  opacity:.4;
  cursor:not-allowed;
  box-shadow:none;
}

#successView{
  display:none;
  position:relative;
  z-index:2;
  flex:1;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
}

.success-icon{
  width:80px;
  height:80px;
  display:grid;
  place-items:center;
  border-radius:26px;
  background:rgba(16,185,129,.1);
  color:var(--green);
  font-size:42px;
  font-weight:700;
}

.success-title{
  margin-top:22px;
  font:700 27px "Space Grotesk",sans-serif;
}

.success-sub{
  margin-top:8px;
  color:var(--muted);
  font-size:14px;
}

.success-amount{
  margin-top:17px;
  padding:9px 16px;
  border-radius:999px;
  background:rgba(62,123,250,.08);
  color:var(--blue);
  font-size:13px;
  font-weight:600;
}

.new{
  margin-top:25px;
  border:1px solid var(--line);
  border-radius:13px;
  padding:11px 18px;
  background:#fff;
  color:var(--muted);
  cursor:pointer;
}

.dashboard-link{
  margin-top:14px;
  color:var(--muted);
  font-size:13px;
  text-decoration:none;
}

#sleepOverlay{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  padding:30px;
  background:#0f172a;
  color:white;
  text-align:center;
  z-index:999;
}

#sleepOverlay h2{
  margin:0 0 10px;
  font:700 30px "Space Grotesk",sans-serif;
}

#sleepOverlay p{
  max-width:340px;
  color:#94a3b8;
  line-height:1.5;
}

#refreshBtn{
  border:0;
  border-radius:14px;
  padding:14px 24px;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  font:600 15px "Space Grotesk",sans-serif;
}

@media(max-height:760px){
  .device{
    min-height:calc(100vh - 20px);
  }

  .amount{
    font-size:45px;
  }

  .key{
    padding:11px 0;
  }
}
</style>
</head>

<body>

<div id="sleepOverlay">
  <h2>SERVER IS SLEEPING</h2>
  <p>Render-palvelin nukkuu. Herätetään se.</p>
  <button id="refreshBtn">Yritä uudelleen</button>
</div>

<main class="device">

  <header class="header">
    <div class="brand">
      <span class="dot"></span>
      Pukku Pankki
    </div>

    <a class="back" href="/">← Takaisin</a>
  </header>

  <section id="payView">

    <div class="receiver">

      <label for="toId">Vastaanottajan ID</label>

      <input
        id="toId"
        type="number"
        min="1"
        inputmode="numeric"
        placeholder="esim. 2"
      >

      <div class="receiver-name" id="receiverName"></div>

    </div>

    <div class="amount-wrap">

      <div class="amount-row">
        <span class="amount placeholder" id="amount">0,00</span>
        <span class="currency">pukku</span>
      </div>

      <div class="amount-label">Syötä summa</div>

    </div>

    <div class="keypad" id="keypad">

      <button class="key" data-key="1">1</button>
      <button class="key" data-key="2">2</button>
      <button class="key" data-key="3">3</button>

      <button class="key" data-key="4">4</button>
      <button class="key" data-key="5">5</button>
      <button class="key" data-key="6">6</button>

      <button class="key" data-key="7">7</button>
      <button class="key" data-key="8">8</button>
      <button class="key" data-key="9">9</button>

      <button class="key func" data-key="clear">Tyhjennä</button>
      <button class="key" data-key="0">0</button>
      <button class="key func" data-key="back">⌫</button>

    </div>

    <div class="error" id="error"></div>

    <button class="pay" id="payButton" disabled>
      Siirrä pukkuja
    </button>

  </section>

  <section id="successView">

    <div class="success-icon">✓</div>

    <div class="success-title">Siirto onnistui!</div>

    <div class="success-sub">Pukut siirrettiin onnistuneesti.</div>

    <div class="success-amount" id="successAmount">0,00 pukku</div>

    <button class="new" id="newPayment">Uusi siirto</button>

    <a class="dashboard-link" href="/">← Dashboard</a>

  </section>

</main>

<script>
const API_BASE = "https://pukku-1.onrender.com";

const overlay = document.getElementById("sleepOverlay");

let cents = 0;

function formatCents(value) {
  return (value / 100).toLocaleString("fi-FI", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

async function request(url, options = {}, timeout = 7000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);

  try {
    const response = await fetch(API_BASE + url, {
      ...options,
      signal: controller.signal,
      credentials: "include"
    });
    clearTimeout(timer);
    return response;
  } catch (error) {
    clearTimeout(timer);
    throw error;
  }
}

async function checkAuth() {
  try {
    const response = await request("/api/me");

    if (response.status === 401) {
      location.href = "/login.html";
      return;
    }

    if (!response.ok) throw new Error();

    overlay.style.display = "none";
  } catch {
    overlay.style.display = "flex";
  }
}

function renderAmount() {
  const amount = document.getElementById("amount");
  amount.textContent = formatCents(cents);
  amount.classList.toggle("placeholder", cents === 0);
  updatePayButton();
}

function updatePayButton() {
  const id = document.getElementById("toId").value;
  const button = document.getElementById("payButton");
  button.disabled = cents <= 0 || !id;
}

let lookupTimer;

document.getElementById("toId").addEventListener("input", () => {
  const id = document.getElementById("toId").value;
  const name = document.getElementById("receiverName");

  name.textContent = "";
  clearTimeout(lookupTimer);
  updatePayButton();

  if (!id) return;

  lookupTimer = setTimeout(async () => {
    try {
      const response = await request(`/api/user/${encodeURIComponent(id)}`);

      if (response.ok) {
        const user = await response.json();
        name.textContent = user.username;
      } else {
        name.textContent = "Käyttäjää ei löydy";
      }
    } catch (error) {
      if (error.name === "AbortError" || error instanceof TypeError) {
        overlay.style.display = "flex";
      }
    }
  }, 350);
});

document.getElementById("keypad").addEventListener("click", (event) => {
  const button = event.target.closest(".key");
  if (!button) return;

  const key = button.dataset.key;

  if (key === "clear") {
    cents = 0;
  } else if (key === "back") {
    cents = Math.floor(cents / 10);
  } else {
    const digit = Number(key);
    if (Number.isInteger(digit) && cents < 99999999) {
      cents = cents * 10 + digit;
    }
  }

  renderAmount();
});

document.getElementById("payButton").addEventListener("click", async () => {
  const button = document.getElementById("payButton");
  const error = document.getElementById("error");
  const toId = document.getElementById("toId").value;

  if (button.disabled) return;

  error.style.display = "none";
  button.disabled = true;
  button.textContent = "Käsitellään…";

  try {
    const response = await request("/api/transfer", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        toId,
        amount: cents / 100
      })
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      error.textContent = data.error || "Siirto epäonnistui";
      error.style.display = "block";
      button.textContent = "Siirrä pukkuja";
      updatePayButton();
      return;
    }

    document.getElementById("successAmount").textContent =
      formatCents(cents) + " pukku";

    document.getElementById("payView").style.display = "none";
    document.getElementById("successView").style.display = "flex";
  } catch (err) {
    if (err.name === "AbortError" || err instanceof TypeError) {
      overlay.style.display = "flex";
    } else {
      document.getElementById("error").textContent =
        "Verkkovirhe. Yritä uudelleen.";
      document.getElementById("error").style.display = "block";
    }

    button.textContent = "Siirrä pukkuja";
    updatePayButton();
  }
});

document.getElementById("newPayment").addEventListener("click", () => {
  cents = 0;
  document.getElementById("toId").value = "";
  document.getElementById("receiverName").textContent = "";
  document.getElementById("error").style.display = "none";
  document.getElementById("successView").style.display = "none";
  document.getElementById("payView").style.display = "flex";
  document.getElementById("payButton").textContent = "Siirrä pukkuja";
  renderAmount();
});

document.getElementById("refreshBtn").addEventListener("click", () => {
  location.reload();
});

renderAmount();
checkAuth();
</script>

</body>
</html>
