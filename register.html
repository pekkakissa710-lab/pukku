<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekisteröidy — Pukku Pankki</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#EEF2FA;--panel:#fff;--blue:#3E7BFA;--blue-soft:#2A5FE0;--blue-glow:rgba(62,123,250,.28);--line:rgba(16,24,40,.09);--text:#10182B;--muted:#7C879E;--error:#EF4444}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,rgba(62,123,250,.08),transparent 60%),var(--ink);font-family:Inter,sans-serif;color:var(--text)}
    .card{width:100%;max-width:400px;background:var(--panel);border-radius:24px;padding:32px 28px;border:1px solid var(--line);box-shadow:0 20px 50px -20px rgba(16,24,40,.15)}
    .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:20px}
    .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 8px var(--blue-glow)}
    h1{font-family:'Space Grotesk',sans-serif;font-size:26px;margin:0 0 8px}
    .muted{color:var(--muted);font-size:14px;margin-bottom:24px}
    label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--muted)}
    input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:15px;background:#F6F8FC;margin-bottom:14px;font-family:inherit;transition:all 0.2s}
    input:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px var(--blue-glow)}
    .btn{width:100%;padding:14px;border:none;border-radius:14px;font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue-soft));cursor:pointer;transition:all 0.2s}
    .btn:hover{box-shadow:0 8px 20px var(--blue-glow)}
    .btn:disabled{opacity:0.5;cursor:not-allowed}
    .error-popup{position:fixed;bottom:20px;right:20px;background:var(--error);color:#fff;padding:16px 24px;border-radius:12px;font-size:14px;max-width:300px;box-shadow:0 10px 30px rgba(239,68,68,.3);animation:slideIn 0.3s ease;z-index:10000}
    .success-popup{position:fixed;bottom:20px;right:20px;background:#10B981;color:#fff;padding:16px 24px;border-radius:12px;font-size:14px;max-width:300px;box-shadow:0 10px 30px rgba(16,185,129,.3);animation:slideIn 0.3s ease;z-index:10000}
    @keyframes slideIn{from{transform:translateX(400px);opacity:0}to{transform:translateX(0);opacity:1}}
    @keyframes slideOut{to{transform:translateX(400px);opacity:0}}
    .popup.removing{animation:slideOut 0.3s ease}
    a{color:var(--blue);text-decoration:none}
    .footer{text-align:center;margin-top:20px;font-size:14px}

    #sleepOverlay{
      position:fixed;inset:0;z-index:9999;background:#0f172a;
      display:none;flex-direction:column;align-items:center;justify-content:center;
      color:#fff;text-align:center;padding:32px;font-family:'Space Grotesk',sans-serif;
    }
    #sleepOverlay h1{font-size:28px;margin:0 0 12px;letter-spacing:.04em}
    #sleepOverlay p{color:#94a3b8;font-size:15px;margin:0 0 28px;max-width:320px;line-height:1.5}
    #sleepOverlay button{
      padding:14px 28px;border:none;border-radius:14px;
      background:linear-gradient(135deg,#3E7BFA,#2A5FE0);color:#fff;
      font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;cursor:pointer;
    }
  </style>
</head>
<body>
  <div id="sleepOverlay">
    <h1>SERVER IS SLEEPING</h1>
    <p>Render free-tier nukkuu. Paina nappia herättääksesi palvelimen (kestää 30–60 sekuntia).</p>
    <button id="refreshBtn">Refresh</button>
  </div>

  <div class="card">
    <div class="eyebrow"><span class="dot"></span>Pukku Pankki</div>
    <h1>Luo tili</h1>
    <p class="muted">Aloita 50,00 pukulla!</p>
    <form id="form">
      <label>Käyttäjänimi (min 3 merkkiä)</label>
      <input type="text" id="username" required minlength="3" autocomplete="username" autofocus>
      <label>Salasana (min 6 merkkiä)</label>
      <input type="password" id="password" required minlength="6" autocomplete="new-password">
      <button type="submit" class="btn" id="submitBtn">Luo tili</button>
    </form>
    <p class="footer">Onko jo tili? <a href="login.html">Kirjaudu</a></p>
  </div>

  <script>
    const overlay = document.getElementById('sleepOverlay');

    function showPopup(message, type = 'error') {
      const popup = document.createElement('div');
      popup.className = type === 'error' ? 'error-popup' : 'success-popup';
      popup.textContent = message;
      document.body.appendChild(popup);
      
      setTimeout(() => {
        popup.classList.add('removing');
        setTimeout(() => popup.remove(), 300);
      }, 4000);
    }

    async function fetchWithTimeout(url, options = {}, timeoutMs = 5000) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
      
      try {
        const response = await fetch(url, {
          ...options,
          signal: controller.signal,
          credentials: 'include'
        });
        clearTimeout(timeoutId);
        return response;
      } catch (err) {
        clearTimeout(timeoutId);
        throw err;
      }
    }

    async function checkServer() {
      try {
        await fetchWithTimeout('/api/health', {}, 5000);
        overlay.style.display = 'none';
      } catch (err) {
        if (err.name === 'AbortError' || err instanceof TypeError) {
          overlay.style.display = 'flex';
        }
      }
    }

    document.getElementById('refreshBtn').onclick = () => {
      overlay.querySelector('p').textContent = 'Herätetään serveriä… odota 30–60s';
      fetchWithTimeout('/api/health', {}, 6000).catch(() => {});
      setTimeout(() => location.reload(), 4000);
    };

    checkServer();

    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;

      try {
        const res = await fetchWithTimeout('/api/register', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        }, 5000);

        const data = await res.json();
        if (data.success) {
          showPopup('Tili luotu! Kirjaudutaan sisään...', 'success');
          setTimeout(() => location.href = 'login.html', 500);
        } else {
          showPopup(data.error || 'Rekisteröinti epäonnistui');
          submitBtn.disabled = false;
        }
      } catch (err) {
        if (err.name === 'AbortError' || err instanceof TypeError) {
          overlay.style.display = 'flex';
        } else {
          showPopup('Verkkovirhe, yritä uudelleen');
        }
        submitBtn.disabled = false;
      }
    };
  </script>
</body>
</html>
