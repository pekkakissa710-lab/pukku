<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pukku Pankki</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#EEF2FA;--panel:#fff;--blue:#3E7BFA;--blue-soft:#2A5FE0;--blue-glow:rgba(62,123,250,.28);--line:rgba(16,24,40,.09);--text:#10182B;--muted:#7C879E;--success:#10B981;--error:#EF4444}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(1200px 600px at 50% -10%,rgba(62,123,250,.08),transparent 60%),var(--ink);font-family:Inter,sans-serif;color:var(--text);padding:24px}
    .container{max-width:480px;margin:0 auto}
    .card{background:var(--panel);border-radius:24px;padding:28px 24px;border:1px solid var(--line);box-shadow:0 20px 50px -20px rgba(16,24,40,.15);margin-bottom:20px}
    .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
    .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 8px var(--blue-glow)}
    .nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    .nav a{font-size:13px;color:var(--muted);text-decoration:none;cursor:pointer}
    .balance-big{font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:700;margin:8px 0 4px}
    .muted{color:var(--muted);font-size:14px}
    h2{font-family:'Space Grotesk',sans-serif;font-size:20px;margin:0 0 16px}
    label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--muted)}
    input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:15px;background:#F6F8FC;margin-bottom:14px;font-family:inherit}
    input:focus{outline:none;border-color:var(--blue);background:#fff}
    .btn{width:100%;padding:14px;border:none;border-radius:14px;font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue-soft));cursor:pointer;box-shadow:0 10px 25px -8px var(--blue-glow)}
    .msg{padding:12px 16px;border-radius:12px;font-size:14px;margin-bottom:16px;display:none}
    .msg.ok{background:rgba(16,185,129,.12);color:#047857;border:1px solid rgba(16,185,129,.3)}
    .msg.err{background:rgba(239,68,68,.1);color:#B91C1C;border:1px solid rgba(239,68,68,.25)}
    .tx{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
    .tx:last-child{border-bottom:none}
    .out{color:var(--error)}.in{color:var(--success)}
  </style>
</head>
<body>
  <div class="container">
    <div class="nav">
      <div class="eyebrow"><span class="dot"></span>Pukku Pankki</div>
      <a id="logout">Kirjaudu ulos</a>
    </div>

    <div class="card">
      <p class="muted" style="margin:0">Hei, <strong id="username">...</strong></p>
      <div class="balance-big" id="balance">—</div>
      <p class="muted" style="margin:0">Käytettävissä oleva saldo</p>
    </div>

    <div class="card">
      <h2>Siirrä pukkuja</h2>
      <div class="msg" id="msg"></div>
      <form id="transferForm">
        <label>Vastaanottaja</label>
        <input type="text" id="to" required placeholder="esim. bob">
        <label>Summa (pukku)</label>
        <input type="text" id="amount" required placeholder="12,50" inputmode="decimal">
        <label>Viesti (valinnainen)</label>
        <input type="text" id="note" maxlength="100" placeholder="Kiitos!">
        <button type="submit" class="btn">Siirrä</button>
      </form>
    </div>

    <div class="card">
      <h2>Tapahtumat</h2>
      <div id="txs"><p class="muted">Ladataan...</p></div>
    </div>
  </div>

  <script>
    async function load() {
      const res = await fetch('/api/me', {credentials:'include'});
      if (!res.ok) return location.href = 'login.html';
      const data = await res.json();
      document.getElementById('username').textContent = data.username;
      document.getElementById('balance').textContent = data.balanceStr;

      const txRes = await fetch('/api/transactions', {credentials:'include'});
      const txs = await txRes.json();
      const box = document.getElementById('txs');
      if (!txs.length) {
        box.innerHTML = '<p class="muted">Ei vielä tapahtumia.</p>';
        return;
      }
      box.innerHTML = txs.map(tx => `
        <div class="tx">
          <div>
            ${tx.isOut ? '→ ' + tx.to_name : '← ' + (tx.from_name || 'Järjestelmä')}
            ${tx.note ? '<br><span class="muted" style="font-size:12px">'+tx.note+'</span>' : ''}
            <br><span class="muted" style="font-size:12px">${tx.created_at.slice(0,16).replace('T',' ')}</span>
          </div>
          <div class="\( {tx.isOut ? 'out' : 'in'}"> \){tx.isOut ? '-' : '+'}${tx.amountStr}</div>
        </div>
      `).join('');
    }

    document.getElementById('transferForm').onsubmit = async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      msg.style.display = 'none';
      const res = await fetch('/api/transfer', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        credentials: 'include',
        body: JSON.stringify({
          to: document.getElementById('to').value,
          amount: document.getElementById('amount').value,
          note: document.getElementById('note').value
        })
      });
      const data = await res.json();
      msg.style.display = 'block';
      if (data.success) {
        msg.className = 'msg ok';
        msg.textContent = data.message;
        document.getElementById('to').value = '';
        document.getElementById('amount').value = '';
        document.getElementById('note').value = '';
        load();
      } else {
        msg.className = 'msg err';
        msg.textContent = data.error || 'Virhe';
      }
    };

    document.getElementById('logout').onclick = async () => {
      await fetch('/api/logout', {method:'POST', credentials:'include'});
      location.href = 'login.html';
    };

    load();
  </script>
</body>
</html>
